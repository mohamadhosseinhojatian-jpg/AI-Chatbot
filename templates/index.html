
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>BlueChat — AI Assistant</title>
<style>
:root {
  color-scheme: dark;
  --bg: #07111f;
  --panel: #0a1728;
  --surface: #102238;
  --surface-hover: #162d46;
  --border: #203a55;
  --text: #e9f4ff;
  --muted: #8ba6c1;
  --blue: #258cff;
  --cyan: #53dcff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 55% -25%, #12365a 0%, transparent 50%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}
button, textarea { font: inherit; }
button { cursor: pointer; }
.app { display: flex; height: 100%; }
.sidebar {
  width: 258px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 22px;
  padding: 22px 15px;
  background: rgba(7, 17, 31, .96);
  border-inline-end: 1px solid var(--border);
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 4px 7px 17px;
  font-size: 22px;
  font-weight: 750;
  letter-spacing: -.7px;
}
.brand-name { color: var(--text); }
.brand-name span { color: var(--cyan); }
.brand-mark {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border: 1px solid #287fc0;
  border-radius: 13px;
  color: var(--cyan);
  background: linear-gradient(145deg, #174d7c, #10233c);
  box-shadow: 0 0 24px #258cff22;
}
.brand-mark svg { width: 27px; height: 27px; }
.new-chat, .language {
  color: var(--text);
  border: 1px solid var(--border);
  background: transparent;
  border-radius: 12px;
  padding: 12px;
  transition: background .2s, border-color .2s;
}
.new-chat { text-align: start; }
.new-chat:hover, .language:hover {
  background: var(--surface-hover);
  border-color: #3473a8;
}
.side-label {
  color: #6584a2;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.6px;
  padding: 4px 9px;
}
.side-info {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px 9px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #43ddb1;
  box-shadow: 0 0 12px #43ddb188;
  flex-shrink: 0;
}
.sidebar-footer {
  margin-top: auto;
  padding: 14px 9px 3px;
  border-top: 1px solid var(--border);
  color: #6e8ca9;
  font-size: 12px;
  line-height: 1.8;
}
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 68px;
  padding: 0 27px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #1b3045;
  background: #07111f88;
}
.top-title { font-weight: 650; letter-spacing: .2px; }
.top-subtitle { color: var(--muted); font-size: 12px; margin-top: 3px; }
.language { padding: 9px 13px; font-size: 13px; }
.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 28px 20px;
  scroll-behavior: smooth;
  scrollbar-color: #284766 transparent;
}
.welcome {
  max-width: 760px;
  margin: 10vh auto 40px;
  text-align: center;
  animation: appear .5s ease both;
}
.orb {
  width: 86px;
  height: 86px;
  margin: 0 auto 27px;
  display: grid;
  place-items: center;
  position: relative;
  border-radius: 28px;
  border: 1px solid #3a8ed0;
  background: linear-gradient(145deg, #123c64, #0a1b30);
  box-shadow: 0 0 35px #258cff25, inset 0 0 24px #53dcff0d;
}
.orb::before {
  content: "";
  position: absolute;
  inset: -8px;
  border: 1px solid #258cff38;
  border-radius: 33px;
  animation: pulse 3s ease-in-out infinite;
}
.orb svg { width: 47px; height: 47px; }
.welcome h1 {
  font-size: clamp(27px, 4vw, 39px);
  line-height: 1.35;
  margin: 0 0 14px;
  letter-spacing: -.8px;
}
.gradient-text {
  background: linear-gradient(100deg, #68e4ff, #4798ff 65%, #8aabff);
  color: transparent;
  background-clip: text;
  -webkit-background-clip: text;
}
.welcome p {
  color: var(--muted);
  line-height: 1.9;
  margin: 0 auto;
  max-width: 530px;
}
.suggestions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
  margin: 32px auto 0;
  max-width: 600px;
  text-align: start;
}
.suggestion {
  min-height: 76px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 14px 16px;
  color: var(--text);
  text-align: start;
  background: #0d1c2d;
  border: 1px solid var(--border);
  border-radius: 14px;
  transition: transform .2s, border-color .2s, background .2s;
}
.suggestion:hover {
  transform: translateY(-2px);
  border-color: #347fc0;
  background: var(--surface);
}
.suggestion strong { font-size: 13px; font-weight: 600; }
.suggestion span { color: var(--muted); font-size: 12px; }
.message-row {
  max-width: 800px;
  margin: 0 auto 23px;
  display: flex;
  animation: appear .2s ease both;
}
.user-row { justify-content: flex-start; }
.ai-row { justify-content: flex-end; }
.message {
  max-width: 90%;
  padding: 13px 17px;
  border-radius: 17px;
  line-height: 1.9;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  unicode-bidi: plaintext;
  text-align: start;
}
.user-message {
  background: linear-gradient(145deg, #14375a, #102942);
  border: 1px solid #24527b;
  border-end-start-radius: 5px;
}
.ai-message {
  background: #0d1b2b;
  border: 1px solid #1d344b;
  border-end-end-radius: 5px;
}
.ai-label {
  color: var(--cyan);
  font-size: 11px;
  margin-bottom: 5px;
  letter-spacing: .3px;
}
.typing {
  display: inline-flex;
  gap: 5px;
  padding: 7px 2px;
}
.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  animation: bounce 1s infinite ease-in-out;
}
.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }
.composer-wrap {
  padding: 12px 20px 19px;
  background: linear-gradient(0deg, var(--bg) 65%, transparent);
}
.composer {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 11px 12px;
  border: 1px solid #294968;
  border-radius: 20px;
  background: #0d1d30;
  box-shadow: 0 8px 35px #0002;
  transition: border-color .2s, box-shadow .2s;
}
.composer:focus-within {
  border-color: #318bce;
  box-shadow: 0 0 0 3px #258cff12, 0 8px 35px #0002;
}
textarea {
  flex: 1;
  min-width: 0;
  max-height: 170px;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  padding: 9px 7px;
  line-height: 1.7;
  font-size: 15px;
}
textarea::placeholder { color: #7591ad; }
.send {
  flex-shrink: 0;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 13px;
  color: #041321;
  background: linear-gradient(135deg, #63e3ff, #3692ff);
  box-shadow: 0 3px 15px #258cff25;
  transition: transform .2s, opacity .2s;
}
.send:hover { transform: translateY(-2px); }
.send:disabled { opacity: .45; cursor: wait; transform: none; }
.send svg { width: 20px; height: 20px; }
.disclaimer {
  text-align: center;
  font-size: 11px;
  color: #65809a;
  margin-top: 11px;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: .65; }
  50% { transform: scale(1.06); opacity: .2; }
}
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .5; }
  30% { transform: translateY(-5px); opacity: 1; }
}
@keyframes appear {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 700px) {
  .sidebar { display: none; }
  .topbar { height: 59px; padding: 0 15px; }
  .messages { padding: 20px 12px; }
  .welcome { margin-top: 7vh; }
  .orb { width: 70px; height: 70px; border-radius: 23px; }
  .orb::before { border-radius: 27px; }
  .orb svg { width: 39px; height: 39px; }
  .suggestions { gap: 8px; margin-top: 24px; }
  .suggestion { padding: 12px; min-height: 78px; }
  .message { max-width: 95%; }
  .composer-wrap { padding: 10px 10px 13px; }
  .composer { border-radius: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M9 12.5C9 10.6 10.6 9 12.5 9H27.5C29.4 9 31 10.6 31 12.5V23C31 24.9 29.4 26.5 27.5 26.5H20L12 32V26.5H12.5C10.6 26.5 9 24.9 9 23V12.5Z" stroke="currentColor" stroke-width="2"/>
          <circle cx="15" cy="18" r="1.7" fill="currentColor"/>
          <circle cx="20" cy="18" r="1.7" fill="currentColor"/>
          <circle cx="25" cy="18" r="1.7" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-name">Blue<span>Chat</span></div>
    </div>

    <button class="new-chat" id="newChat">＋ گفت‌وگوی جدید</button>
    <div class="side-label" id="sideLabel">دستیار هوشمند</div>
    <div class="side-info">
      <span class="status-dot"></span>
      <span id="sideInfo">قدرت‌گرفته از Gemini</span>
    </div>
    <div class="sidebar-footer" id="sideFooter">
      Your ideas. Beyond limits.<br>
      ساخته‌شده برای کنجکاوی شما.
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="top-title">BlueChat</div>
        <div class="top-subtitle" id="topSubtitle">Your AI companion</div>
      </div>
      <button class="language" id="languageBtn">English</button>
    </header>

    <section class="messages" id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="orb" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M24 5L27.5 18L40 12L31 23L43 28L29 29L32 43L23 32L14 42L17 29L4 26L17 22L11 10L22 18L24 5Z"
              stroke="#62DEFF" stroke-width="1.7" stroke-linejoin="round"/>
            <circle cx="24" cy="25" r="5" fill="#2E96FF"/>
          </svg>
        </div>
        <h1 id="welcomeTitle">فراتر از <span class="gradient-text">انتظار</span> فکر کن.</h1>
        <p id="welcomeText">ایده‌هات رو مطرح کن؛ از یادگیری تا ساختن، با هم پیش می‌ریم.</p>
        <div class="suggestions" id="suggestions">
          <button class="suggestion" data-prompt="یک مهارت جدید بهم یاد بده">
            <strong id="suggest1Title">یادگیری و کشف</strong>
            <span id="suggest1Text">یک موضوع جدید یاد بگیر</span>
          </button>
          <button class="suggestion" data-prompt="برای یک پروژه خلاقانه ایده بده">
            <strong id="suggest2Title">ایده‌پردازی</strong>
            <span id="suggest2Text">ایده‌ها رو به عمل تبدیل کن</span>
          </button>
          <button class="suggestion" data-prompt="این کد را بررسی کن و توضیح بده">
            <strong id="suggest3Title">کمک برنامه‌نویسی</strong>
            <span id="suggest3Text">کد بنویس یا اشکال‌زدایی کن</span>
          </button>
          <button class="suggestion" data-prompt="یک موضوع پیچیده را ساده توضیح بده">
            <strong id="suggest4Title">حل مسئله</strong>
            <span id="suggest4Text">راه‌حل‌ها را پیدا کن</span>
          </button>
        </div>
      </div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="chatForm">
        <textarea id="messageInput" rows="1"
          placeholder="از BlueChat هر چیزی بپرس..."
          aria-label="پیام شما"></textarea>
        <button class="send" id="sendBtn" type="submit" aria-label="ارسال پیام">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 19V5M6 11L12 5L18 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
      <div class="disclaimer" id="disclaimer">
        BlueChat ممکن است اشتباه کند؛ اطلاعات مهم را بررسی کن.
      </div>
    </div>
  </main>
</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("messageInput");
const form = document.getElementById("chatForm");
const sendBtn = document.getElementById("sendBtn");
const welcome = document.getElementById("welcome");
const languageBtn = document.getElementById("languageBtn");
const suggestions = document.getElementById("suggestions");

let language = "fa";
let busy = false;

const translations = {
  fa: {
    newChat: "＋ گفت‌وگوی جدید",
    sideLabel: "دستیار هوشمند",
    sideInfo: "قدرت‌گرفته از Gemini",
    footer: "Your ideas. Beyond limits.<br>ساخته‌شده برای کنجکاوی شما.",
    subtitle: "دستیار هوشمند تو",
    welcome: 'فراتر از <span class="gradient-text">انتظار</span> فکر کن.',
    description: "ایده‌هات رو مطرح کن؛ از یادگیری تا ساختن، با هم پیش می‌ریم.",
    placeholder: "از BlueChat هر چیزی بپرس...",
    disclaimer: "BlueChat ممکن است اشتباه کند؛ اطلاعات مهم را بررسی کن.",
    s1: "یادگیری و کشف", d1: "یک موضوع جدید یاد بگیر",
    s2: "ایده‌پردازی", d2: "ایده‌ها رو به عمل تبدیل کن",
    s3: "کمک برنامه‌نویسی", d3: "کد بنویس یا اشکال‌زدایی کن",
    s4: "حل مسئله", d4: "راه‌حل‌ها را پیدا کن",
    prompts: [
      "یک مهارت جدید بهم یاد بده",
      "برای یک پروژه خلاقانه ایده بده",
      "این کد را بررسی کن و توضیح بده",
      "یک موضوع پیچیده را ساده توضیح بده"
    ],
    sending: "در حال فکر کردن",
    error: "متأسفانه مشکلی پیش آمد. دوباره تلاش کن.",
    language: "English"
  },
  en: {
    newChat: "＋ New conversation",
    sideLabel: "AI ASSISTANT",
    sideInfo: "Powered by Gemini",
    footer: "Your ideas. Beyond limits.<br>Built for your curiosity.",
    subtitle: "Your intelligent companion",
    welcome: 'Think beyond <span class="gradient-text">limits.</span>',
    description: "Bring your ideas to life. Learn, explore, and create with BlueChat.",
    placeholder: "Ask BlueChat anything...",
    disclaimer: "BlueChat can make mistakes. Check important information.",
    s1: "Learn & explore", d1: "Discover something new",
    s2: "Brainstorm ideas", d2: "Turn ideas into action",
    s3: "Coding assistant", d3: "Write or debug code",
    s4: "Solve a problem", d4: "Explore possible solutions",
    prompts: [
      "Teach me a useful new skill",
      "Give me ideas for a creative project",
      "Review and explain this code",
      "Explain a complex topic simply"
    ],
    sending: "Thinking",
    error: "Something went wrong. Please try again.",
    language: "فارسی"
  }
};

function setLanguage(lang) {
  language = lang;
  const t = translations[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";

  document.getElementById("newChat").textContent = t.newChat;
  document.getElementById("sideLabel").textContent = t.sideLabel;
  document.getElementById("sideInfo").textContent = t.sideInfo;
  document.getElementById("sideFooter").innerHTML = t.footer;
  document.getElementById("topSubtitle").textContent = t.subtitle;
  document.getElementById("welcomeTitle").innerHTML = t.welcome;
  document.getElementById("welcomeText").textContent = t.description;
  document.getElementById("disclaimer").textContent = t.disclaimer;
  input.placeholder = t.placeholder;
  languageBtn.textContent = t.language;

  ["s1", "s2", "s3", "s4"].forEach((key, i) => {
    document.getElementById("suggest" + (i + 1) + "Title").textContent = t[key];
    document.getElementById("suggest" + (i + 1) + "Text").textContent = t["d" + (i + 1)];
    document.querySelectorAll(".suggestion")[i].dataset.prompt = t.prompts[i];
  });
}

languageBtn.addEventListener("click", () => {
  setLanguage(language === "fa" ? "en" : "fa");
});

function addMessage(text, type) {
  const row = document.createElement("div");
  row.className = "message-row " + (type === "user" ? "user-row" : "ai-row");

  const bubble = document.createElement("div");
  bubble.className = "message " + (type === "user" ? "user-message" : "ai-message");

  if (type === "ai") {
    const label = document.createElement("div");
    label.className = "ai-label";
    label.textContent = "BLUECHAT AI";
    bubble.appendChild(label);
  }

  const content = document.createElement("div");
  content.textContent = text;
  bubble.appendChild(content);
  row.appendChild(bubble);
  messages.appendChild(row);
  messages.scrollTop = messages.scrollHeight;
  return content;
}

function addTyping() {
  const row = document.createElement("div");
  row.className = "message-row ai-row";
  const bubble = document.createElement("div");
  bubble.className = "message ai-message";
  bubble.innerHTML = '<div class="ai-label">BLUECHAT AI</div><div class="typing" aria-label="Thinking"><span></span><span></span><span></span></div>';
  row.appendChild(bubble);
  messages.appendChild(row);
  messages.scrollTop = messages.scrollHeight;
  return row;
}

async function sendMessage(text = input.value.trim()) {
  if (!text || busy) return;

  welcome.hidden = true;
  addMessage(text, "user");
  input.value = "";
  input.style.height = "auto";
  busy = true;
  sendBtn.disabled = true;

  const typing = addTyping();

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const data = await response.json();
    if (!response.ok) throw new Error("Request failed");

    typing.remove();
    addMessage(data.response || translations[language].error, "ai");
  } catch (error) {
    typing.remove();
    addMessage(translations[language].error, "ai");
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
    messages.scrollTop = messages.scrollHeight;
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();
  sendMessage();
});

suggestions.addEventListener("click", event => {
  const button = event.target.closest(".suggestion");
  if (button) sendMessage(button.dataset.prompt);
});

document.getElementById("newChat").addEventListener("click", () => {
  if (busy) return;
  messages.replaceChildren(welcome);
  welcome.hidden = false;
  input.value = "";
  input.style.height = "auto";
  input.focus();
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 170) + "px";
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

setLanguage("fa");
</script>
</body>
</html>
